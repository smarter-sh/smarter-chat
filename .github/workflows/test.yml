---
#------------------------------------------------------------------------------
# Format, lint, type check, test and build Smarter Chat, and upload the tests'
# coverage to Codecov.
#
# The repository is self-contained: its TypeScript, Vite, Vitest, Storybook,
# ESLint and Prettier configuration is its own, the same as the npm workspace
# of https://github.com/smarter-sh/smarter, where it is also developed. So
# this workflow needs neither Smarter nor its backend.
#
# Requires a CODECOV_TOKEN secret.
#------------------------------------------------------------------------------
name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - alpha

jobs:
  react:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      # npm install rather than npm ci: package-lock.json belongs to the
      # Smarter workspace, and is not committed to this repository.
      - name: npm install
        run: make init

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Types (TypeScript)
        run: npm run typecheck

      - name: Unit tests (Vitest), with coverage
        run: make coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build the app and the npm package
        env:
          NODE_ENV: production
        run: make build
