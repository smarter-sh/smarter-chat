default_language_version:
  # default language version for each language
  python: python3.13
repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.0
    hooks:
      - id: codespell
        args: ["--ignore-words=codespell.txt"]
        exclude: '\.svg$|^node_modules/|^dist/'
  # Smarter Chat is developed inside the npm workspace of https://github.com/smarter-sh/smarter,
  # two directories up, whose Prettier and ESLint configuration it shares. See README.md.
  - repo: local
    hooks:
      - id: prettier
        name: prettier (smarter workspace)
        entry: bash -c 'cd ../.. && npx --no-install prettier --write --ignore-unknown "${@/#/packages/smarter-chat/}"' --
        language: system
        exclude: "^CHANGELOG.md$"
      - id: eslint
        name: eslint (smarter workspace)
        entry: bash -c 'cd ../.. && npx --no-install eslint --max-warnings=0 --no-warn-ignored "${@/#/packages/smarter-chat/}"' --
        language: system
        files: \.(ts|tsx|js)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # See https://pre-commit.com/hooks.html for more hooks
      #- id: check-added-large-files
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-json
        exclude: "dist/.*"
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
        exclude: "node_modules/"
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: trailing-whitespace
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.20.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-angular"]
ci:
  # for more information, see https://pre-commit.ci
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: [shellcheck, markdown-link-check, commitlint]
  submodules: false
